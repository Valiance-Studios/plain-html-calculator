<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="src/styles/main.css" />
    <script type="module" src="src/main.ts"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e1e1e" />
    <title>plain-html-calculator</title>
  </head>
  <body>
    <div class="calculator-wrapper">
      <div class="calculator-top">
        <div class="calculator-display" id="calculator-display">
          <button id="btn-toggle-mode" class="btn standard mode-toggle" type="button" title="Switch calculator view (M)" data-type="action" value="toggle-mode">SCI</button>
          <!-- Secondary display for current expression context (e.g., "1234 +") -->
          <div class="display-secondary" id="display-secondary"></div>
          <!-- Primary display for active input / computed result -->
          <div class="display-primary" id="display-primary">0</div>
        </div>
      </div>
      <div class="calculator-bottom">
        <div class="calculator-keys-scientific">
          <button id="btn-open-parenthesis" class="btn standard" style="grid-area: sci-open" type="button" title="Open parenthesis" data-type="action" value="open-parenthesis">(</button>
          <button id="btn-close-parenthesis" class="btn standard" style="grid-area: sci-close" type="button" title="Close parenthesis" data-type="action" value="close-parenthesis">)</button>
          <button id="btn-op-mod" class="btn standard" style="grid-area: sci-mod" type="button" title="Remainder (Shift+M)" data-type="operator" value="mod">mod</button>
          <button id="btn-toggle-angle" class="btn standard" style="grid-area: sci-angle" type="button" title="Switch between degrees and radians (D)" data-type="action" value="toggle-angle">DEG</button>
          <button id="btn-fn-sin" class="btn standard" style="grid-area: sci-sin" type="button" title="Sine (S)" data-type="function" value="sin">sin</button>
          <button id="btn-fn-cos" class="btn standard" style="grid-area: sci-cos" type="button" title="Cosine (C)" data-type="function" value="cos">cos</button>
          <button id="btn-fn-tan" class="btn standard" style="grid-area: sci-tan" type="button" title="Tangent (T)" data-type="function" value="tan">tan</button>
          <button id="btn-fn-asin" class="btn standard" style="grid-area: sci-asin" type="button" title="Inverse sine (Shift+S)" data-type="function" value="asin">sin<sup>-1</sup></button>
          <button id="btn-fn-acos" class="btn standard" style="grid-area: sci-acos" type="button" title="Inverse cosine (Shift+C)" data-type="function" value="acos">cos<sup>-1</sup></button>
          <button id="btn-fn-atan" class="btn standard" style="grid-area: sci-atan" type="button" title="Inverse tangent (Shift+T)" data-type="function" value="atan">tan<sup>-1</sup></button>
          <button id="btn-fn-ln" class="btn standard" style="grid-area: sci-ln" type="button" title="Natural logarithm (N)" data-type="function" value="ln">ln</button>
          <button id="btn-fn-log" class="btn standard" style="grid-area: sci-log" type="button" title="Base-10 logarithm (L)" data-type="function" value="log">log</button>
          <button id="btn-fn-sqrt" class="btn standard" style="grid-area: sci-sqrt" type="button" title="Square root (R)" data-type="function" value="sqrt">&radic;</button>
          <button id="btn-fn-cbrt" class="btn standard" style="grid-area: sci-cbrt" type="button" title="Cube root (Shift+R)" data-type="function" value="cbrt"><sup>3</sup>&radic;</button>
          <button id="btn-fn-square" class="btn standard" style="grid-area: sci-square" type="button" title="Square (Q)" data-type="function" value="square">x<sup>2</sup></button>
          <button id="btn-op-power" class="btn standard" style="grid-area: sci-power" type="button" title="Power (^)" data-type="operator" value="^">x<sup>y</sup></button>
          <button id="btn-const-pi" class="btn standard" style="grid-area: sci-pi" type="button" title="Pi (P)" data-type="constant" value="pi">&pi;</button>
          <button id="btn-const-e" class="btn standard" style="grid-area: sci-e" type="button" title="Euler's number (E)" data-type="constant" value="e">e</button>
        </div>
        <div class="calculator-keys-wrapper">
          <button id="btn-all-clear" class="btn standard" style="grid-area: all-clear" type="button" data-type="action" value="all-clear">AC</button>
          <button id="btn-single-delete" class="btn standard" style="grid-area: single-delete" type="button" data-type="action" value="delete">DEL</button>
          <button id="btn-invert-sign" class="btn standard" style="grid-area: invert-sign" type="button" data-type="action" value="invert-sign">+/-</button>
          <button id="btn-num-7" class="btn standard" style="grid-area: num-7" type="button" data-type="number" value="7">7</button>
          <button id="btn-num-8" class="btn standard" style="grid-area: num-8" type="button" data-type="number" value="8">8</button>
          <button id="btn-num-9" class="btn standard" style="grid-area: num-9" type="button" data-type="number" value="9">9</button>
          <button id="btn-num-4" class="btn standard" style="grid-area: num-4" type="button" data-type="number" value="4">4</button>
          <button id="btn-num-5" class="btn standard" style="grid-area: num-5" type="button" data-type="number" value="5">5</button>
          <button id="btn-num-6" class="btn standard" style="grid-area: num-6" type="button" data-type="number" value="6">6</button>
          <button id="btn-num-1" class="btn standard" style="grid-area: num-1" type="button" data-type="number" value="1">1</button>
          <button id="btn-num-2" class="btn standard" style="grid-area: num-2" type="button" data-type="number" value="2">2</button>
          <button id="btn-num-3" class="btn standard" style="grid-area: num-3" type="button" data-type="number" value="3">3</button>
          <button id="btn-num-0" class="btn standard" style="grid-area: num-0" type="button" data-type="number" value="0">0</button>
          <button id="btn-num-00" class="btn standard" style="grid-area: num-00" type="button" data-type="number" value="00">00</button>
          <button id="btn-num-decimal" class="btn standard" style="grid-area: num-decimal" type="button" data-type="number" value=".">.</button>
          <button id="btn-op-percent" class="btn operator" style="grid-area: operator-percent" type="button" data-type="action" value="percent">%</button>
          <button id="btn-op-divide" class="btn operator" style="grid-area: operator-divide" type="button" data-type="operator" value="/">&divide;</button>
          <button id="btn-op-multiply" class="btn operator" style="grid-area: operator-multiply" type="button" data-type="operator" value="*">&times;</button>
          <button id="btn-op-minus" class="btn operator" style="grid-area: operator-minus" type="button" data-type="operator" value="-">-</button>
          <button id="btn-op-plus" class="btn operator" style="grid-area: operator-plus" type="button" data-type="operator" value="+">+</button>
          <button id="btn-op-equals" class="btn operator" style="grid-area: operator-equals" type="button" data-type="action" value="calculate">=</button>
        </div>
      </div>
    </div>
  </body>
</html>
